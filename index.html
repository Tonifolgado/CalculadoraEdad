<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Edad</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
        }
        .container-glass {
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 1.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        .metric-card {
            background: white;
            border: 1px solid #f3f4f6;
            transition: all 0.2s ease-in-out;
        }
        .metric-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            border-color: #dbeafe;
        }
table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 0.85rem;
        }
        th {
            background-color: #e0f2fe;
            color: #0369a1;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.025em;
            padding: 1rem;
        }
        td {
            padding: 1rem;
            border-bottom: 1px solid #f1f5f9;
            color: #334155;
        }
        tr:last-child td {
            border-bottom: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 gap-6">

    <div class="container-glass max-w-xl w-full p-8 md:p-10 text-center">
        <h1 class="text-4xl font-extrabold text-gray-900 mb-2 tracking-tight">Calculadora de Edad</h1>
        <p class="text-gray-500 mb-8">Descubre cuánto tiempo ha pasado y qué ocurrió en el mundo.</p>
        
        <div class="mb-8 text-left">
            <label for="birthdate" class="block text-sm font-semibold text-gray-700 mb-2">Fecha de nacimiento</label>
            <input type="date" id="birthdate" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-200 outline-none">
            <p id="formatted-date-display" class="text-xs font-medium text-blue-500 mt-2 hidden"></p>
        </div>
        
        <div id="results" class="hidden text-left space-y-6">
            <div>
                <h2 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    Tiempo transcurrido
                </h2>
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
                    <!-- Años -->
                    <div class="metric-card rounded-2xl p-4 flex flex-col items-center justify-center">
                        <span class="text-[10px] uppercase tracking-widest font-bold text-gray-400 mb-1">Años</span>
                        <span id="years" class="text-2xl font-black text-blue-600">0</span>
                    </div>
                    <!-- Meses -->
                    <div class="metric-card rounded-2xl p-4 flex flex-col items-center justify-center">
                        <span class="text-[10px] uppercase tracking-widest font-bold text-gray-400 mb-1">Meses</span>
                        <span id="months" class="text-2xl font-black text-blue-600">0</span>
                    </div>
                    <!-- Semanas -->
                    <div class="metric-card rounded-2xl p-4 flex flex-col items-center justify-center">
                        <span class="text-[10px] uppercase tracking-widest font-bold text-gray-400 mb-1">Semanas</span>
                        <span id="weeks" class="text-2xl font-black text-blue-600">0</span>
                    </div>
                    <!-- Días -->
                    <div class="metric-card rounded-2xl p-4 flex flex-col items-center justify-center">
                        <span class="text-[10px] uppercase tracking-widest font-bold text-gray-400 mb-1">Días</span>
                        <span id="days" class="text-2xl font-black text-blue-600">0</span>
                    </div>
                    <!-- Horas -->
                    <div class="metric-card rounded-2xl p-4 flex flex-col items-center justify-center col-span-2 sm:col-span-1">
                        <span class="text-[10px] uppercase tracking-widest font-bold text-gray-400 mb-1">Horas</span>
                        <span id="hours" class="text-2xl font-black text-blue-600">0</span>
                    </div>
                </div>
            </div>

        </div>

        <p id="error-message" class="hidden text-sm font-medium text-red-500 mt-6 p-3 bg-red-50 rounded-lg"></p>
    </div>

    <!-- Converter: time unit → years -->
    <div class="container-glass max-w-xl w-full p-8 md:p-10 text-center">
        <h2 class="text-2xl font-extrabold text-gray-900 mb-2 tracking-tight">Convertir tiempo a años</h2>
        <p class="text-gray-500 mb-6">Introduce un valor y selecciona la unidad.</p>

        <div class="flex gap-3 mb-6">
            <input
                type="number"
                id="time-input"
                min="0"
                placeholder="Ej. 8760"
                class="flex-1 px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-200 outline-none text-right"
            >
            <select
                id="unit-select"
                class="px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-200 outline-none font-medium text-gray-700"
            >
                <option value="hours">Horas</option>
                <option value="months">Meses</option>
                <option value="minutes">Minutos</option>
            </select>
        </div>

        <div id="conversion-result" class="hidden metric-card rounded-2xl p-6 text-center">
            <span class="text-[10px] uppercase tracking-widest font-bold text-gray-400 block mb-1">Equivale a</span>
            <span id="converted-years" class="text-4xl font-black text-blue-600">0</span>
            <span class="text-xl font-bold text-gray-500 ml-2">años</span>
            <p id="conversion-detail" class="text-xs text-gray-400 mt-2"></p>
        </div>

        <p id="conversion-error" class="hidden text-sm font-medium text-red-500 mt-4 p-3 bg-red-50 rounded-lg"></p>
    </div>

    <script type="module" src="index.tsx"></script>
</body>
</html>
