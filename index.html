<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Edad</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div class="container">
        <h1 style="font-size: 2rem; font-weight: 700; color: #0369a1; margin-bottom: 1.5rem;">
            📅 Calculadora de Edad
        </h1>

        <div style="margin-bottom: 2rem;">
            <label for="birthdate" style="font-weight: 600; color: #1f2937; display: block; margin-bottom: 0.5rem;">
                Selecciona tu fecha de nacimiento:
            </label>
            <input 
                type="date" 
                id="birthdate" 
                style="width: 100%; padding: 0.75rem; border: 2px solid #3b82f6; border-radius: 0.5rem; font-size: 1rem;"
            />
        </div>

        <p id="formatted-date-display" class="hidden" style="font-size: 0.9rem; color: #0369a1; font-weight: 600; margin-bottom: 1rem;"></p>

        <div id="results" class="hidden result-card">
            <h2 style="font-size: 1.25rem; font-weight: 600; color: #0c4a6e; margin-bottom: 1rem;">
                Tu edad
            </h2>
            <table>
                <thead>
                    <tr>
                        <th>Años</th>
                        <th>Meses</th>
                        <th>Semanas</th>
                        <th>Días</th>
                        <th>Horas</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td id="years">0</td>
                        <td id="months">0</td>
                        <td id="weeks">0</td>
                        <td id="days">0</td>
                        <td id="hours">0</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div style="margin-top: 2rem;">
            <button 
                id="gemini-btn"
                style="width: 100%; padding: 0.75rem; background-color: #3b82f6; color: white; font-weight: 600; border-radius: 0.5rem; border: none; cursor: pointer; font-size: 1rem; transition: background-color 0.3s ease;"
                onmouseover="this.style.backgroundColor='#2563eb'"
                onmouseout="this.style.backgroundColor='#3b82f6'"
            >
                ⌛ Obtener acontecimientos históricos ⌛
            </button>
        </div>

        <div id="gemini-output" class="hidden gemini-card"></div>

        <p id="error-message" class="hidden text-red-500 mt-4"></p>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
